<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 Chúc Mừng 20/10 🌟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Nền vũ trụ Galaxy không hề sến */
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    font-family: 'Segoe UI', 'Arial', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Hiệu ứng ánh sáng vũ trụ */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.3), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 191, 255, 0.2), transparent 50%);
    animation: glow 8s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes glow {
    from { opacity: 0.6; }
    to   { opacity: 1; }
  }

  /* Thiệp chính phong cách kính mờ */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 40px 30px;
    max-width: 600px;
    width: 90%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 
                0 0 20px rgba(138, 43, 226, 0.3) inset;
    animation: cardIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.8) translateY(50px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* Huy hiệu ngày */
  .date-badge {
    display: inline-block;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: white;
    padding: 8px 24px;
    border-radius: 50px;
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 14px;
    box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }

  /* Tiêu đề phát sáng */
  h1 {
    font-size: 2.2rem;
    background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 15px 0 5px 0;
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(79, 172, 254, 0.3);
  }

  .sender-name {
    font-size: 1.1rem;
    color: #a29bfe;
    font-weight: bold;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Lời chúc tình bạn */
  .message {
    font-size: 1.1rem;
    color: #e0e0e0;
    line-height: 1.8;
    margin: 15px 0;
    font-weight: 500;
  }

  .message strong { color: #00f2fe; }

  .hearts-row {
    font-size: 1.8rem;
    margin-top: 20px;
    letter-spacing: 8px;
  }

  .hearts-row span {
    display: inline-block;
    animation: bounce 1.5s ease-in-out infinite;
  }

  .hearts-row span:nth-child(2) { animation-delay: 0.2s; }
  .hearts-row span:nth-child(3) { animation-delay: 0.4s; }
  .hearts-row span:nth-child(4) { animation-delay: 0.6s; }
  .hearts-row span:nth-child(5) { animation-delay: 0.8s; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  /* Sao băng rơi */
  .star-fall {
    position: fixed;
    top: -50px;
    font-size: 20px;
    animation: fall linear infinite;
    pointer-events: none;
    z-index: 1;
    opacity: 0.9;
    filter: drop-shadow(0 0 5px #fff);
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
  }

  /* Nút bấm */
  .btn {
    margin-top: 25px;
    padding: 14px 40px;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: white;
    border: none;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
    transition: all 0.3s ease;
  }

  .btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 28px rgba(0, 114, 255, 0.6);
  }

  .btn:active { transform: scale(0.98); }
</style>
</head>
<body>

<!-- Thiệp chúc mừng -->
<div class="card">
  <div class="date-badge">20 · 10</div>
  <h1>Chúc Mừng Ngày 20/10</h1>
  <div class="sender-name">🌟 Từ: Ahn Khoii 🌟</div>
  <p class="message">
    Gửi đến <strong>hội chị em xinh đẹp của lớp mình</strong> lời chúc tốt đẹp nhất!<br>
    Chúc các bạn luôn <strong>rạng rỡ, học giỏi, thi cử thuận lợi</strong><br>
    Luôn là những cô gái tự tin và tỏa sáng nhất nhé! 🌻<br><br>
    <strong>Ahn Khoii gửi tặng mọi người món quà nhỏ này! 🎉</strong>
  </p>
  <div class="hearts-row">
    <span>🌻</span><span>✨</span><span>🌟</span><span>🎊</span><span>🌷</span>
  </div>
  <button class="btn" onclick="showLove()">💌 Bấm Vào Đây Nha</button>
</div>

<script>
  // Hiệu ứng sao và hoa rơi (Không còn trái tim)
  const items = ['✨','⭐','🌟','🌻','🌷','🌸','🎊','🎉'];
  function createItem() {
    const p = document.createElement('div');
    p.className = 'star-fall';
    p.textContent = items[Math.floor(Math.random() * items.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.fontSize = (Math.random() * 15 + 15) + 'px';
    const duration = Math.random() * 5 + 5; // Rơi nhanh hơn chút
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = Math.random() * 5 + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), (duration + 6) * 1000);
  }
  setInterval(createItem, 300);

  // Hiệu ứng bắn pháo hoa sao khi bấm nút
  function showLove() {
    for (let i = 0; i < 40; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.textContent = ['✨','🌟','🎉','🎊','🌻','🌷'][Math.floor(Math.random()*6)];
        h.style.cssText = `
          position: fixed; left: ${Math.random() * 100}vw; top: ${Math.random() * 100}vh;
          font-size: ${Math.random() * 25 + 20}px; pointer-events: none; z-index: 100;
          animation: pop 1.5s ease-out forwards;
        `;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1500);
      }, i * 30);
    }
    setTimeout(() => {
      alert('🌻 Chúc hội bạn gái lớp mình ngày 20/10 thật nhiều niềm vui, chăm ngoan học giỏi và ngày càng xinh đẹp nhé!\\n- Từ Ahn Khoii -');
    }, 800);
  }
</script>

<style>
  @keyframes pop {
    0%   { transform: scale(0) rotate(0deg); opacity: 1; }
    50%  { transform: scale(1.5) rotate(180deg); opacity: 1; }
    100% { transform: scale(0) rotate(360deg) translateY(-100px); opacity: 0; }
  }
</style>

</body>
</html>
