<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Chúc Mừng 20/10 🌸</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fbc2eb 100%);
    font-family: 'Segoe UI', 'Arial', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255,182,193,0.4), transparent 40%);
    animation: glow 6s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes glow { from { opacity: 0.5; } to { opacity: 1; } }
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 40px 30px;
    max-width: 600px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255, 105, 180, 0.4), 0 0 0 3px rgba(255, 255, 255, 0.6) inset;
    animation: cardIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 2px solid rgba(255, 255, 255, 0.8);
  }
  @keyframes cardIn { from { opacity: 0; transform: scale(0.8) translateY(50px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .date-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ff6b9d, #ff2d6f);
    color: white;
    padding: 8px 24px;
    border-radius: 50px;
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 14px;
    box-shadow: 0 4px 15px rgba(255, 45, 111, 0.4);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  h1 {
    font-size: 2.2rem;
    background: linear-gradient(135deg, #ff2d6f, #ff6b9d, #c44569);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 15px 0 5px 0;
    font-weight: 900;
    letter-spacing: 1px;
  }
  .sender-name { font-size: 1.1rem; color: #c44569; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
  .message { font-size: 1.1rem; color: #7d2e4a; line-height: 1.8; margin: 15px 0; font-weight: 500; }
  .message strong { color: #ff2d6f; }
  .hearts-row { font-size: 1.8rem; margin-top: 20px; letter-spacing: 8px; }
  .hearts-row span { display: inline-block; animation: bounce 1.5s ease-in-out infinite; }
  .hearts-row span:nth-child(2) { animation-delay: 0.2s; }
  .hearts-row span:nth-child(3) { animation-delay: 0.4s; }
  .hearts-row span:nth-child(4) { animation-delay: 0.6s; }
  .hearts-row span:nth-child(5) { animation-delay: 0.8s; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .petal { position: fixed; top: -50px; font-size: 24px; animation: fall linear infinite; pointer-events: none; z-index: 1; opacity: 0.9; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  .heart-float { position: fixed; bottom: -50px; font-size: 20px; animation: floatUp linear infinite; pointer-events: none; z-index: 2; opacity: 0.85; }
  @keyframes floatUp { to { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }
  .btn {
    margin-top: 25px;
    padding: 14px 40px;
    background: linear-gradient(135deg, #ff6b9d, #ff2d6f);
    color: white;
    border: none;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 45, 111, 0.4);
    transition: all 0.3s ease;
  }
  .btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 12px 28px rgba(255, 45, 111, 0.6); }
  .btn:active { transform: scale(0.98); }
</style>
</head>
<body>

<div class="card">
  <div class="date-badge">20 · 10</div>
  <h1>Chúc Mừng Ngày 20/10</h1>
  <div class="sender-name">💌 Từ: Ahn Khoii</div>
  <p class="message">
    Gửi đến <strong>các cô gái xinh đẹp của lớp mình</strong> lời chúc tốt đẹp nhất!<br>
    Chúc các bạn luôn <strong>rạng rỡ, học giỏi, gặp nhiều may mắn</strong><br>
    Mãi là những đóa hoa tươi vui nhất của lớp nhé 🌷<br><br>
    <strong>Ahn Khoii gửi tặng mọi người món quà nhỏ này! 💖</strong>
  </p>
  <div class="hearts-row">
    <span>💐</span><span>❤️</span><span>🌸</span><span>💖</span><span>🌹</span>
  </div>
  <button class="btn" onclick="showLove()">💌 Bấm Vào Đây Nha</button>
</div>

<script>
  const petals = ['🌸','🌺','🌷','💮','🏵️','🌼','💐'];
  function createPetal() {
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = petals[Math.floor(Math.random() * petals.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.fontSize = (Math.random() * 20 + 15) + 'px';
    const duration = Math.random() * 6 + 6;
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = Math.random() * 5 + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), (duration + 6) * 1000);
  }
  setInterval(createPetal, 400);

  const hearts = ['❤️','💖','💕','💗','💝','🩷'];
  function createHeart() {
    const h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (Math.random() * 15 + 15) + 'px';
    const duration = Math.random() * 5 + 6;
    h.style.animationDuration = duration + 's';
    h.style.animationDelay = Math.random() * 3 + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), (duration + 5) * 1000);
  }
  setInterval(createHeart, 600);

  function showLove() {
    for (let i = 0; i < 40; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.textContent = ['💖','❤️','🌸','✨','💐','🎉'][Math.floor(Math.random()*6)];
        h.style.cssText = `
          position: fixed; left: ${Math.random() * 100}vw; top: ${Math.random() * 100}vh;
          font-size: ${Math.random() * 30 + 20}px; pointer-events: none; z-index: 100;
          animation: pop 1.5s ease-out forwards;
        `;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1500);
      }, i * 30);
    }
    setTimeout(() => {
      alert('💐 Chúc các bạn nữ lớp mình 20/10 thật nhiều niềm vui và hạnh phúc!\\n- Từ Ahn Khoii -');
    }, 800);
  }
</script>
<style>
  @keyframes pop { 0% { transform: scale(0) rotate(0deg); opacity: 1; } 50% { transform: scale(1.5) rotate(180deg); opacity: 1; } 100% { transform: scale(0) rotate(360deg) translateY(-100px); opacity: 0; } }
</style>
</body>
</html>
